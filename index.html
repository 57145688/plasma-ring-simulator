<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plasma Ring V0.6</title><style>body{background:#091225;color:#e7f1ff;font:15px system-ui;margin:0}header,main{padding:20px;max-width:1100px;margin:auto}section{background:#15223a;border:1px solid #304465;border-radius:12px;padding:16px;margin:12px 0}canvas{width:100%;height:390px;background:#060d1c;border-radius:10px}label{display:block;margin:10px 0}input{width:100%}button{padding:9px 16px;background:#31639e;border:0;border-radius:7px;color:white}small{color:#adbfda}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><h2>Plasma Ring · V0.6</h2><p>127 mm 玻璃球 / 氩气研究假设 / 气压未知 HOLD</p><small>磁场和感应电场是简化的自由空间数值估算；发光环为独立的经验视觉演示，不是自洽等离子体计算。</small></header><main><div class="grid"><div><section><h3>球体、线圈及视频时间轴</h3><canvas id="ball"></canvas><button id="play">播放 0–9 秒</button><button id="reset">复位</button><p id="state"></p></section><section><h3>轴对称 r–z 截面（归一化显示）</h3><canvas id="field"></canvas><p id="metrics"></p><small>线圈分段积分计算磁矢势 Aφ、磁场 B；Eφ≈ωAφ，未包括玻璃介质、等离子体反馈或电容耦合。</small></section></div><section><h3>交互参数</h3><div id="controls"></div><label>显示场量<select id="q"><option value="E">|Eφ|</option><option value="B">|B|</option><option value="A">|Aφ|</option></select></label><button id="compute">计算电磁场</button><button id="csv">导出 CSV</button><p id="status"></p></section></div></main><script>
const $=id=>document.getElementById(id),params=[['time','视频时间 s',0,9,0,.1],['rotation','球体旋转 °',0,360,0,1],['tilt','球体倾斜 °',-20,20,0,1],['offset','球心偏移 mm',-15,15,0,1],['hand','手部扰动（视觉）',0,1,0,.05],['charge','表面电荷扰动（视觉）',0,1,0,.05],['turns','线圈匝数',3,18,9,1],['radius','线圈平均半径 mm',45,85,65,1],['pitch','匝间距 mm',0,3,1,.5],['zcoil','线圈高度 mm',-80,-60,-69,1],['current','电流峰值 A（假设）',.1,5,1,.1],['freq','频率 kHz（假设）',10,500,100,10]];
$('controls').innerHTML=params.map(([id,name,min,max,v,step])=>'<label>'+name+' <b id="'+id+'v">'+v+'</b><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'"></label>').join('');
const v=id=>+$ (id).value;let rows=[],playing=false,last=0;
function fit(c){let d=devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}return[w,h]}
function state(t){if(t<2)return['强环状放电',.92];if(t<4.7)return['衰减 / 弥散辉光',.10+Math.max(0,3-t)*.16];if(t<7.6)return['重新形成',.35+.55*Math.min(1,(t-4.7)/1.6)];return['再次减弱',Math.max(.08,.75-(t-7.6)*.58)]}
function ball(){let c=$('ball'),[w,h]=fit(c),g=c.getContext('2d'),R=Math.min(h*.38,w*.33),x=w/2+v('offset')*w/300,y=h*.50,t=v('time'),[name,bright]=state(t);g.clearRect(0,0,w,h);g.save();g.translate(x,y);g.rotate(v('tilt')*Math.PI/180);g.beginPath();g.arc(0,0,R,0,7);g.fillStyle='rgba(89,117,240,.13)';g.fill();g.strokeStyle='#92c4ef';g.lineWidth=3;g.stroke();g.save();g.rotate(v('rotation')*Math.PI/180);g.strokeStyle='#e8bf8d';g.beginPath();g.moveTo(-5,-R);g.lineTo(0,-R-15);g.lineTo(5,-R);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(R*.4,-R*.5,4,0,7);g.fill();g.restore();for(let j=0;j<3;j++){g.beginPath();g.ellipse(v('hand')*R*.25,R*(.26-j*.14),R*(.78-j*.07),R*(.23-j*.04),v('charge')*.24,0,7);g.strokeStyle='rgba(202,151,255,'+(bright*(1-j*.20))+')';g.shadowColor='#bf7cff';g.shadowBlur=25*bright;g.lineWidth=5-j;g.stroke()}g.restore();g.shadowBlur=0;g.beginPath();g.ellipse(w/2,h*.88,R*.95,R*.12,0,0,7);g.strokeStyle='#f6cb7b';g.lineWidth=7;g.stroke();$('state').textContent=t.toFixed(1)+' 秒：'+name+'（经验时间曲线；非定量测量）'}
function calculate(){let N=v('turns'),R=v('radius')/1000,p=v('pitch')/1000,z0=v('zcoil')/1000,I=v('current'),omega=2*Math.PI*v('freq')*1000,segments=72,mu=1e-7,wires=[];for(let n=0;n<N;n++){let rad=R+(n-(N-1)/2)*p;for(let j=0;j<segments;j++){let a=(j+.5)*2*Math.PI/segments,da=2*Math.PI/segments;wires.push([rad*Math.cos(a),rad*Math.sin(a),z0,-rad*Math.sin(a)*da,rad*Math.cos(a)*da])}}function at(r,z){let Ay=0,bx=0,by=0,bz=0;for(let [x,y,zz,dx,dy] of wires){let rx=r-x,ry=-y,rz=z-zz,d2=rx*rx+ry*ry+rz*rz+1e-10,d=Math.sqrt(d2),c=mu*I/d,c3=mu*I/(d2*d);Ay+=dy*c;bx+=dy*rz*c3;by-=dx*rz*c3;bz+=(dx*ry-dy*rx)*c3}let A=Math.abs(Ay),B=Math.hypot(bx,by,bz);return{A,B,E:omega*A}}rows=[];for(let iz=0;iz<61;iz++)for(let ir=0;ir<51;ir++){let r=ir*.1/50,z=-.09+iz*.18/60;rows.push({r,z,...at(r,z)})}let center=at(0,0),inside=rows.filter(x=>x.r*x.r+x.z*x.z<.0635**2);$('metrics').textContent='球心 B ≈ '+(center.B*1e3).toFixed(3)+' mT；球内最大 Eφ ≈ '+Math.max(...inside.map(x=>x.E)).toFixed(2)+' V/m（给定电流假设）';$('status').textContent=rows.length+' 网格点已计算；气压未知 HOLD';field()}
function field(){if(!rows.length)return;let c=$('field'),[w,h]=fit(c),g=c.getContext('2d'),q=$('q').value,m=Math.max(...rows.map(x=>x[q]));g.clearRect(0,0,w,h);for(let i=0;i<rows.length;i++){let o=rows[i],p=Math.sqrt(o[q]/(m||1)),ir=i%51,iz=Math.floor(i/51);g.fillStyle='rgb('+Math.round(20+220*p)+','+Math.round(30+110*Math.sin(p*Math.PI))+','+Math.round(75+140*(1-p))+')';g.fillRect(ir*w/51,(60-iz)*h/61,w/51+1,h/61+1)}g.beginPath();g.ellipse(0,h/2,.0635/.1*w,.0635/.18*h,0,-Math.PI/2,Math.PI/2);g.setLineDash([6,5]);g.strokeStyle='#ffffff';g.lineWidth=2;g.stroke();g.setLineDash([])}
params.forEach(([id])=>$(id).oninput=()=>{$(id+'v').textContent=$(id).value;if(['time','rotation','tilt','offset','hand','charge'].includes(id))ball()});
$('compute').onclick=calculate;$('q').onchange=field;$('reset').onclick=()=>{$('time').value=0;$('timev').textContent=0;ball()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放 0–9 秒';last=0;if(playing)requestAnimationFrame(tick)};function tick(now){if(!playing)return;if(last){let t=v('time')+(now-last)/1000;$('time').value=t>9?0:t;$('timev').textContent=v('time').toFixed(1);ball()}last=now;requestAnimationFrame(tick)}
$('csv').onclick=()=>{let data=['r_m,z_m,Aphi_Wb_per_m,B_T,Ephi_V_per_m',...rows.map(o=>[o.r,o.z,o.A,o.B,o.E].join(','))].join('\n'),u=URL.createObjectURL(new Blob([data],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='field_v06.csv';a.click();URL.revokeObjectURL(u)};window.onresize=()=>{ball();field()};ball();calculate();
</script></body></html>
